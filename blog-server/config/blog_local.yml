
server:
  http_port: 8080
  enable_pprof: true
  log_level: debug
  env: dev
  enable_gzip: false
  min_size: 1024  # 小于1KB的响应不压缩
  gzip_exclude_types:  # 这些类型不压缩
    - "image/*"
    - "video/*"
    - "audio/*"
    - "application/zip"
    - "application/x-rar-compressed"

mysql:
  dialect: mysql
  user: root
  password: 123456
  host: 127.0.0.1
  port: 3306
  database: edu.mall
  charset: utf8mb4
  show_mysql: true
  max_open: 20
  max_idle: 5

redis:
  addr: 127.0.0.1:6379
  password: ""
  db_index: 0
  max_idle: 2
  max_open: 10

logger:
  path: ./logs
  file_name: blog_server.log
  max_size: 10
  max_backups: 5
  max_age: 7
  compress: true

